<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>growi-plugin-datatables - across editor mode</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      /* GROWI の TableWithEditButton.module.scss 相当 (growi.html と同じ) */
      .editable-with-handsontable {
        position: relative;
      }

      .editable-with-handsontable .handsontable-modal-trigger {
        position: absolute;
        top: 8px;
        right: 10px;
        padding: 0;
        font-size: 16px;
        line-height: 1;
        background-color: transparent;
        border: none;
        opacity: 0;
      }

      .editable-with-handsontable:hover .handsontable-modal-trigger {
        opacity: 1;
      }

      .material-symbols-outlined {
        display: inline-block;
        width: 16px;
        height: 16px;
        background: currentColor;
      }

      body {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="MockTableAcrossEditorMode"></div>
    <script type="module" src="/src/mock/MockTableAcrossEditorMode.tsx"></script>
  </body>
</html>
